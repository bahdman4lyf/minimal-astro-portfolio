<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- "b" for blank: a stem and a gradient bowl. Geometric on purpose so it
       stays crisp at 16px and needs no font. -->
  <defs>
    <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset=".55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".04"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="#131316"/>
  <rect x="1" y="1" width="126" height="126" rx="29" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <rect x="36" y="26" width="17" height="76" rx="8.5" fill="#fff"/>
  <circle cx="71" cy="77" r="25" fill="url(#bowl)"/>
  <circle cx="71" cy="77" r="11.5" fill="#131316"/>
</svg>
